name: R07 simulation sanity checks

on:
  push:
    branches:
      - simulation/r07-gazebo-terrain
  pull_request:
    branches:
      - main

jobs:
  python-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install simulator dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r simulation/tools/requirements.txt
      - name: Syntax check
        run: |
          python -m py_compile simulation/tools/r07_campus_sim.py simulation/tools/scan_to_polar_map.py
      - name: Route-planner self-test
        run: |
          python simulation/tools/r07_campus_sim.py --self-test
