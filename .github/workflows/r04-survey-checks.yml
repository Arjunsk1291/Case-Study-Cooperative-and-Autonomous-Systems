name: R04 survey backend and firmware checks

on:
  push:
    branches:
      - survey/r04-investigation-2026-10-30
    paths:
      - "cas_box/**"
      - "laptop_survey/**"
      - "camera_s3/**"
      - ".github/workflows/r04-survey-checks.yml"
  pull_request:
    branches:
      - main

jobs:
  laptop-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laptop_survey
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
      - name: Python syntax checks
        run: |
          python -m py_compile app.py manager.py analysis.py tests/test_analysis.py tests/test_storage_helpers.py tests/test_session_lifecycle.py
      - name: Unit tests
        env:
          PYTHONPATH: .
        run: pytest -q

  main-esp32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.1
      - name: Install main-box libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "ESP Async WebServer"
          arduino-cli lib install "Async TCP"
          arduino-cli lib install "Adafruit BNO055"
          arduino-cli lib install "Adafruit Unified Sensor"
          arduino-cli lib install "Adafruit SSD1306"
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit BusIO"
          arduino-cli lib install "TinyGPSPlus-ESP32"
      - name: Compile main ESP32 (R04 box controller)
        run: arduino-cli compile --fqbn esp32:esp32:esp32 cas_box

  ai-thinker-camera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.1
      - name: Compile AI-Thinker ESP32-CAM (OV2640)
        run: arduino-cli compile --fqbn esp32:esp32:esp32cam camera_s3/CameraStation
